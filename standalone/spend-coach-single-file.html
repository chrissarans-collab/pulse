<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spend Coach Pay</title><style>
:root{--bg:#eceef6;--card:#fff;--tx:#1b1d29;--mut:#6b7086;--line:#eceef5;--bar:#e6e8f0;--pri:#5f259f;--ok:#138808;--warn:#f47b20;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1d2028;--tx:#e9ebf2;--mut:#9aa0b4;--line:#2a2e39;--bar:#2a2e39}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1d2028;--tx:#e9ebf2;--mut:#9aa0b4;--line:#2a2e39;--bar:#2a2e39}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx)}
.app{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:20px;max-width:1000px;margin:0 auto;padding:16px;align-items:start}
@media(max-width:820px){.app{grid-template-columns:minmax(0,1fr)}}
.phone{background:var(--card);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px #0002;min-height:640px;display:flex;flex-direction:column}
.top{background:linear-gradient(135deg,#5f259f,#3b1c8c);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.top span{background:#fff3;border-radius:6px;padding:2px 8px;font-size:12px;margin-left:6px}
.stripe{height:4px;background:linear-gradient(90deg,#f47b20 33%,#fff 33% 66%,#138808 66%)}
.scr{padding:16px;flex:1}
.hero{background:linear-gradient(135deg,#5f259f,#8e44ad);color:#fff;border-radius:18px;padding:18px;margin-bottom:16px}
.hero h1{margin:4px 0;font-size:32px}.hero small{opacity:.85}
h4{margin:6px 0 10px;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mer{background:none;border:0;color:var(--tx);font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px}
.ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px}.ic.big{width:72px;height:72px;font-size:34px;margin:8px auto}
.center{text-align:center}.back{background:none;border:0;font-size:22px;color:var(--tx);cursor:pointer}
.amt{display:flex;justify-content:center;align-items:center;font-size:44px;font-weight:700;margin:14px 0}
.amt input{width:170px;font-size:44px;font-weight:700;border:0;border-bottom:2px solid var(--pri);background:none;color:var(--tx);text-align:center;outline:0}
.chips{display:flex;gap:8px;justify-content:center;margin-bottom:22px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:20px;padding:7px 14px;cursor:pointer}
.cta{width:100%;padding:14px;border:0;border-radius:14px;background:var(--pri);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.dots{display:flex;gap:14px;justify-content:center;margin:22px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}.dots i.f{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{padding:16px;font-size:22px;border:0;border-radius:14px;background:var(--bg);color:var(--tx);cursor:pointer}
.tick{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;font-size:46px;display:grid;place-items:center;margin:16px auto;animation:pop .5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.sheet{background:#fff8e1;color:#3a2e00;border-left:5px solid var(--warn);border-radius:14px;padding:14px;margin:16px 0;text-align:left}
.sheet button{padding:9px 14px;border:0;border-radius:10px;cursor:pointer;font-weight:600;margin-right:8px;background:var(--ok);color:#fff}.sheet button.g{background:#e3dfd0;color:#333}
.sheet.bad{background:#fff0f0;border-color:#e03131;color:#4a0d0d}.sheet.bad button{background:#e03131}.alt div{margin:5px 0;font-size:13px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--tx);cursor:pointer;font-size:14px}.opt span{font-size:12px;color:var(--mut)}.opt.any{border-color:#e03131}
.quiet{color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}
.card button.s{padding:9px 14px;border:0;border-radius:10px;background:var(--pri);color:#fff;cursor:pointer;margin-right:6px}.card button.s.g{background:var(--bar);color:var(--tx)}
.bar{height:10px;background:var(--bar);border-radius:6px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;border-radius:6px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:8px}.stat div{background:var(--bg);border-radius:12px;padding:10px;font-size:12px;color:var(--mut)}.stat b{display:block;font-size:20px;color:var(--tx)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.pill{border-radius:10px;padding:2px 8px;font-size:11px;color:#fff}
</style></head><body>
<div class="app">
<section class="phone"><div class="top"><div>₹ SpendCoach<span>UPI</span></div><small>you@spendcoach</small></div><div class="stripe"></div><div class="scr" id="curScreen"></div></section>
<section>
<div class="card"><b>Live dashboard</b><p class="quiet" style="margin:4px 0 10px">Pay from the phone, or let the demo play 12 spends for you.</p>
<button class="s" onclick="demo()">▶ Play 12-spend demo</button><button class="s g" onclick="resetAll()">Reset</button><p class="quiet" id="mode" style="margin:10px 0 0"></p></div>
<div class="card"><b>Monthly caps</b><div id="caps" style="margin-top:10px"></div></div>
<div class="card"><b>Scorecard: accepted swaps vs extra tokens</b><div class="stat" id="stat"></div><p id="vd" style="font-weight:600"></p></div>
<div class="card"><b>Nudge log</b><div class="wrap"><table><thead><tr><th>#<th>Merchant<th>₹<th>Type<th>Nudge / reason<th>Result</tr></thead><tbody id="log"></tbody></table></div></div>
</section></div>
<script>
const $=id=>document.getElementById(id);
const MER=[["Swiggy","🍔","#fc8019"],["Zomato","🍕","#e23744"],["Dominos","🥡","#006491"],["Starbucks","☕","#00704a"],["Uber","🚕","#222"],["Ola","🛺","#9acd32"],["Rapido","🏍️","#f9c200"],["IRCTC","🚆","#1a4fa3"],["Amazon","📦","#ff9900"],["Myntra","👗","#e91e8c"],["Flipkart","🛍️","#2874f0"],["Local Shop","🏪","#7c8a99"]];
const MERCHANTS={swiggy:"food",zomato:"food",dominos:"food",starbucks:"food",uber:"travel",ola:"travel",rapido:"travel",irctc:"travel",amazon:"shopping",myntra:"shopping",flipkart:"shopping"};
let CAPS={food:3000,travel:2000,shopping:4000};const COL={food:"#fc8019",travel:"#3b5bdb",shopping:"#e91e8c"};
const SWAPS={swiggy:["Pack a home meal next time",.6],zomato:["Try a mess/home meal tonight",.6],dominos:["Share a medium instead of a large",.4],starbucks:["Filter coffee instead",.7],uber:["Take the metro for this route",.65],ola:["Take the metro for this route",.65],rapido:["Share an auto for short trips",.4],irctc:["Book a cheaper class",.3],amazon:["Wishlist it for 48h first",.3],myntra:["Wishlist it for 48h first",.3],flipkart:["Wishlist it for 48h first",.3]};
const TOK=150,RS_PER_1K=0.4;
let pre=null,bi=null,spent,log,n,bal,curScreen="home",sel="",amt="",pin="",last=null,busy=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const inr=v=>Number(v).toLocaleString("en-IN");
const info=name=>MER.find(m=>m[0]==name)||["?","💳","#777"];
// ---------- Hosted backend: coach engine + database ----------
// Database = the hosted "db" document store of this published app (falls back to browser storage, then memory)
const START_BAL=25000,DEFAULT_CAPS={food:3000,travel:2000,shopping:4000};
let DB={payments:[],caps:{...DEFAULT_CAPS}},store=null,mode="starting...";
async function dbInit(){
 try{const c=window.claude&&await Promise.race([claude.use("db"),new Promise(r=>setTimeout(()=>r(null),6000))]);
  if(c){const d=c.doc("spendcoach/state"),sn=await d.get();store=d;if(sn.exists)DB=Object.assign(DB,sn.data());mode="hosted database";return}}catch(e){store=null}
 try{const t=localStorage.getItem("sc_state");if(t)DB=Object.assign(DB,JSON.parse(t));mode="browser storage"}catch(e){mode="memory only"}}
async function dbSave(){try{const o=JSON.parse(JSON.stringify(DB));if(store)await store.set(o);else localStorage.setItem("sc_state",JSON.stringify(o))}catch(e){mode="memory only (read-only viewer)"}}
function spentMap(){const s={};for(const k in DB.caps)s[k]=0;for(const p of DB.payments)if(p.category)s[p.category]+=p.amount;return s}
function coach(key,amount,orig,choice){const cat=MERCHANTS[key];                  // 1. merchant tagger (map only)
 if(!cat)return{nudge:null,reason:"Merchant not in map, so no category and no nudge"};
 const cp=DB.caps,sp=spentMap(),left=cp[cat]-sp[cat],[text,pct]=SWAPS[key],C=cat[0].toUpperCase()+cat.slice(1); // 2. cap counter
 if(["swap","fit","any"].includes(choice)){orig=Math.round(orig||amount);const over=Math.max(0,orig-left),tag=over>0?`Over budget by ₹${over}`:`Low budget, ₹${left-orig} left`;
  const msg={swap:`${tag}: chose "${text}", paid ₹${amount} instead of ₹${orig}`,fit:`${tag}: paid only ₹${amount} to stay in cap`,any:`${tag}: chose to pay ₹${orig} in full`}[choice];
  return{category:cat,nudge:msg,action:choice=="any"?"ignore":"accept",saving:choice=="any"?0:orig-amount,over,reason:over>0?"Over budget":"Low budget"}}
 const rem=left-amount;if(rem>=.25*cp[cat]&&amount<.25*cp[cat])return{category:cat,nudge:null,reason:"Well within cap, so no nudge"};
 const save=Math.round(amount*pct),over=Math.max(0,-rem);                         // 3. one-line suggester (0 model calls)
 const out={category:cat,saving:save,over,reason:over?"Over budget":"Cap nearly used",nudge:over?`Over budget by ₹${over}! ${C} cap is ₹${cp[cat]}. ${text}, saves ~₹${save}.`:`${C} cap: ₹${Math.max(rem,0)} left. ${text}, saves ~₹${save}.`};
 if(over){const r=Object.keys(cp).filter(k=>k!=cat).map(k=>[k,cp[k]-sp[k]]).sort((a,b)=>b[1]-a[1])[0];out.alt={text,newAmt:amount-save,shiftFrom:r[0],shiftAmt:Math.max(0,Math.min(over,r[1])),cat}}
 return out}
async function bPay(b){const merchant=String(b.merchant).trim().slice(0,40),amount=Math.round(+b.amount);
 const e={merchant,amount,status:"success",category:null,nudge:null,saving:0,over:0,model_calls:0,action:null,reason:"",alt:null};
 try{Object.assign(e,coach(merchant.toLowerCase(),amount,b.orig,b.choice))}catch(x){e.reason="Coach error ignored"}  // payment never depends on the coach
 e.id=(DB.payments.length?DB.payments[DB.payments.length-1].id:0)+1;const row={...e};delete row.alt;
 DB.payments.push(row);DB.payments=DB.payments.slice(-400);await dbSave();return e}
function bState(){const log=DB.payments,sh=log.filter(r=>r.nudge),ac=sh.filter(r=>r.action=="accept"),calls=sh.reduce((t,r)=>t+r.model_calls,0),tokens=calls*150,saved=ac.reduce((t,r)=>t+r.saving,0),cost=+(tokens/1000*.4).toFixed(2);
 return{caps:DB.caps,spent:spentMap(),balance:START_BAL-log.reduce((t,r)=>t+r.amount,0),log,stats:{Payments:log.length,Nudges:sh.length,"Over budget":sh.filter(r=>r.over).length,Accepted:ac.length,Ignored:sh.filter(r=>r.action=="ignore").length,Silent:log.length-sh.length,"Model calls":calls,Tokens:tokens,"Saved ₹":saved,"Compute ₹":cost,verdict:saved>=cost?"✅ Worth it: savings cover the compute cost":"⚠️ Nudges cost more than they saved"}}}
async function api(u,b){                                                            // same REST-style calls the UI already uses
 if(u=="/api/state")return bState();if(u=="/api/pay")return bPay(b);
 if(u=="/api/feedback"){const r=DB.payments.find(p=>p.id==b.id&&p.nudge);if(r)r.action=b.action=="accept"?"accept":"ignore";await dbSave();return{ok:true}}
 if(u=="/api/reset"){DB.payments=[];await dbSave();return{ok:true}}return{error:"not found"}}
let ST={verdict:""};
async function sync(){const d=await api("/api/state");CAPS=d.caps;spent=d.spent;log=d.log;bal=d.balance;ST=d.stats}
function stats(){return ST}
// ---------- Phone screens ----------
function go(s){curScreen=s;if(s=="home"){pin="";amt="";pre=null}draw()}
function budgetInfo(m,v){const k=m.trim().toLowerCase(),c=MERCHANTS[k];if(!c)return null;const left=CAPS[c]-spent[c];if(left-v>=.25*CAPS[c]&&v<.25*CAPS[c])return null;const[t,p]=SWAPS[k];return{c,cap:CAPS[c],left,over:Math.max(0,v-left),after:left-v,t,ne:Math.round(v*(1-p)),v}}
function choose(t){const b=bi;amt=t=="swap"?b.ne:t=="fit"?b.left:b.v;pre={c:t,orig:b.v};pin="";go("pin")}
function pick(m){sel=m;go("pay")}
function setAmt(v){$("amt").value=v;preview()}
function toPin(){const v=+$("amt").value;if(!v||v<=0){$("amt").focus();return}amt=v;pin="";const b=budgetInfo(sel,v);if(b){bi=b;go("budget")}else go("pin")}
function key(k){if(k=="⌫")pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;if(pin.length==4){finish()}else draw()}
async function finish(){last=await api("/api/pay",{merchant:sel,amount:amt,choice:pre&&pre.c,orig:pre&&pre.orig});pre=null;await sync();curScreen="ok";draw()}
function altHtml(e){const a=e.alt;return`<div class="alt"><div>➊ <b>Swap:</b> ${a.text}. Cost ~₹${inr(a.newAmt)} instead of ₹${inr(e.amount)}.</div>${a.shiftAmt?`<div>➋ <b>Shift budget:</b> move ₹${inr(a.shiftAmt)} from ${a.shiftFrom} to ${a.cat}.</div>`:""}<div>➌ <b>Pause:</b> hold ${a.cat} spends until the cap resets.</div></div>`}
function preview(){const k=sel.toLowerCase(),c=MERCHANTS[k],v=+$("amt").value,w=$("warn");if(!w)return;if(!c||!v){w.innerHTML="";return}
 const left=CAPS[c]-spent[c],[t,p]=SWAPS[k],ne=Math.round(v*(1-p)),ov=v-left,cap=CAPS[c];
 if(left-v>=.25*cap&&v<.25*cap){w.innerHTML=`<p class="quiet">✓ Within budget: ₹${inr(left-v)} left in ${c}</p><div class="quiet">💡 Cheaper option: ${t}, about ₹${inr(ne)}. <button class="chip" onclick="setAmt(${ne})">Use ₹${inr(ne)}</button></div>`;return}
 w.innerHTML=`<div class="sheet bad"><b>⚠️ ${ov>0?`Over ${c} budget by ₹${inr(ov)}`:left-v<.25*cap?`Only ₹${inr(left-v)} of your ${c} budget would be left`:`Big ${c} purchase: ${Math.round(v/cap*100)}% of your budget`}</b><p style="margin:6px 0">Alternative: ${t}. Pay about ₹${inr(ne)} instead.</p><button onclick="setAmt(${ne})">Use ₹${inr(ne)}</button></div><p class="quiet">You can still pay ₹${inr(v)}. Checkout is never blocked.</p>`}
async function fb(x){if(!last||!last.nudge)return;last.action=x;await api("/api/feedback",{id:last.id,action:x});await sync();draw()}
function draw(){const s=$("curScreen"),i=info(sel);let h="";
 if(curScreen=="home"){h=`<div class="hero"><small>Bank account •••• 4821</small><h1>₹${inr(bal)}</h1><small>Tap a merchant to pay with UPI</small></div><h4>Pay a merchant</h4><div class="grid">${MER.map(m=>`<button class="mer" onclick="pick('${m[0]}')"><span class="ic" style="background:${m[2]}22">${m[1]}</span>${m[0]}</button>`).join("")}</div>`}
 else if(curScreen=="pay"){h=`<button class="back" onclick="go('home')">←</button><div class="center"><span class="ic big" style="background:${i[2]}22">${i[1]}</span><div>Paying <b>${sel}</b></div><div class="quiet">${MERCHANTS[sel.toLowerCase()]?"Category: "+MERCHANTS[sel.toLowerCase()]:"Category: unknown"}</div>
 <div class="amt">₹<input id="amt" type="number" inputmode="numeric" placeholder="0" value="${amt}" oninput="preview()"></div><div class="chips">${[200,500,900,1500].map(v=>`<button class="chip" onclick="setAmt(${v})">₹${v}</button>`).join("")}</div><div id="warn" style="text-align:left"></div></div><button class="cta" onclick="toPin()">Proceed to pay</button>`}
 else if(curScreen=="pin"){h=`<div class="center"><span class="ic big" style="background:${i[2]}22">${i[1]}</span><div>Paying <b>${sel}</b> · <b>₹${inr(amt)}</b></div><p class="quiet">Enter UPI PIN (any 4 digits, this is a mock)</p><div class="dots">${[0,1,2,3].map(k=>`<i class="${k<pin.length?"f":""}"></i>`).join("")}</div></div>
 <div class="pad">${["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k=>k?`<button onclick="key('${k}')">${k}</button>`:"<span></span>").join("")}</div>`}
 else if(curScreen=="budget"){const b=bi;h=`<button class="back" onclick="go('pay')">←</button><div class="center"><div style="font-size:40px">⚠️</div><h3 style="margin:6px 0">${b.over>0?`This exceeds your ${b.c} budget`:b.after<.25*b.cap?`You're almost out of ${b.c} budget`:`Big ${b.c} purchase`}</h3><div class="quiet">Budget ₹${inr(CAPS[b.c])} · left ₹${inr(Math.max(b.left,0))} · this payment ₹${inr(b.v)}</div><b style="color:#e03131">${b.over>0?`Over by ₹${inr(b.over)}`:`₹${inr(b.after)} of budget would be left`}</b></div><h4 style="margin-top:16px">Choose how you want to pay</h4>
 <button class="opt" onclick="choose('swap')"><b>💡 ${b.t}</b><span>Pay about ₹${inr(b.ne)} · saves ₹${inr(b.v-b.ne)}</span></button>
 ${b.over>0&&b.left>0?`<button class="opt" onclick="choose('fit')"><b>🎯 Stay within budget</b><span>Pay only ₹${inr(b.left)} · saves ₹${inr(b.v-b.left)}</span></button>`:""}
 <button class="opt any" onclick="choose('any')"><b>Pay ₹${inr(b.v)} anyway</b><span>${b.over>0?`Goes ₹${inr(b.over)} over the cap.`:`Leaves only ₹${inr(b.after)} in your budget.`} Payment is never blocked.</span></button>`}
 else{const e=last,ic=info(e.merchant);h=`<div class="center"><div class="tick">✓</div><h2 style="margin:0">₹${inr(e.amount)} paid</h2><div class="quiet">to ${e.merchant} · UPI Ref ${4100000000+e.id*7919}</div><b style="color:var(--ok)">Payment successful</b></div>`;
  if(e.nudge){h+=e.action=="accept"?`<div class="sheet">✅ Cheaper option chosen. Saves ~₹${e.saving}.</div>`:e.action=="ignore"?`<div class="sheet">👍 Noted. No problem, your payment is done.</div>`:`<div class="sheet ${e.over?"bad":""}"><b>${e.over?"⚠️ Over budget: alternative path":"💡 Coach tip"}</b><p style="margin:8px 0">${e.nudge}</p>${e.over?altHtml(e):""}<button onclick="fb('accept')">Accept swap</button><button class="g" onclick="fb('ignore')">Ignore</button></div>`}
  else h+=`<p class="quiet center">🤫 Coach stayed silent: ${e.reason}</p>`;
  h+=`<button class="cta" onclick="go('home')">Done</button>`}
 s.innerHTML=h;if(curScreen=="pay")preview();dash()}
function dash(){$("mode").textContent="Database: "+mode;$("caps").innerHTML=Object.keys(CAPS).map(c=>{const p=Math.min(100,spent[c]/CAPS[c]*100);return`<div style="display:flex;justify-content:space-between"><span>${c[0].toUpperCase()+c.slice(1)}</span><span class="quiet">₹${inr(spent[c])} / ₹${inr(CAPS[c])}</span></div><div class="bar"><i style="width:${p}%;background:${p>75?"#e03131":COL[c]}"></i></div>`}).join("");
 const t=stats();$("stat").innerHTML=Object.entries(t).filter(([k])=>k!="verdict").map(([k,v])=>`<div><b>${v}</b>${k}</div>`).join("");$("vd").textContent=t.verdict;
 $("log").innerHTML=log.length?log.slice().reverse().map(e=>`<tr><td>${e.id}<td>${e.merchant}<td>${inr(e.amount)}<td><span class="pill" style="background:${COL[e.category]||"#888"}">${e.category||"unknown"}</span><td>${e.nudge||e.reason}<td>${e.action||(e.nudge?"pending":"silent")}</tr>`).join(""):`<tr><td colspan="6" class="quiet">No payments yet</tr>`}
async function resetAll(){await api("/api/reset",{});await sync();last=null;sel="";amt="";pin="";pre=null;curScreen="home";draw()}
async function demo(){if(busy)return;busy=true;await resetAll();
 const seq=[["Swiggy",900],["Zomato",800],["Uber",600],["Amazon",1500],["Swiggy",700],["Starbucks",350],["Ola",500],["Myntra",1800],["Rapido",200],["Dominos",600],["Uber",700],["Local Shop",300]];let k=0;
 for(const[m,a]of seq){sel=m;amt=a;curScreen="pay";draw();await wait(700);const b=budgetInfo(m,a);if(b){bi=b;curScreen="budget";draw();await wait(1600);choose(k<2?"swap":"any");k++}else{pin="";curScreen="pin";draw()}await wait(500);await finish();await wait(900);
  if(last.nudge&&!last.action){await fb(k<2?"accept":"ignore");k++;await wait(900)}go("home");await wait(300)}
 busy=false}
dbInit().then(sync).then(draw);
</script></body></html>
